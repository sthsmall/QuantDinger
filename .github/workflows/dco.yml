name: DCO

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-off-by:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Developer Certificate of Origin sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          failed=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a valid Signed-off-by trailer."
              failed=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
